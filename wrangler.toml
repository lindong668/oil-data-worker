# ============================================================
# 3 号 原油后端 — B11
# ------------------------------------------------------------
# ★ 本次改动：原油抓取源换成【与 2 号同源的多源链路】
#   biquote → yahoo → yahoo2 → stooq → oilpriceapi(兜底)
#
#   原因：原用 OilPriceAPI 单源，实测出现过 101.53（实为 WTI 价）
#   与 114.19（高出市场约 3%）这类偏离值，与 2 号实时链路对不上。
#   换源后 2 号与 3 号取同一个市场价 → 定格值与报表天然一致。
#
# ★ 抓取频率【保持不变】：原油 "5,20" 每小时两次
#   不改的理由（KV 写入配额是硬约束）：
#     Workers KV 免费版 1,000 次写入/天
#     黄金每 3 分钟 = 480 次/天，原油每小时 2 次 = 48 次/天
#     合计约 528，留有一倍余量 —— 加密原油会撞配额。
#   且每小时 2 次对一个交易日已有 44 个采样点，日线 OHLC 足够。
#
# ★ 部署后需清空旧报表重建：
#     /clear-history?code=brent&confirm=1
#     /clear-history?code=wti&confirm=1
#   （旧报表是 OilPriceAPI 的偏离值攒出来的，必须重来）
# ============================================================

# wrangler.toml  —  oil-data-worker  v6
name = 'oil-data-worker'
account_id = 'd49e51b1279804c22035a33a9c1cb06e'
main = "src/index.js"
compatibility_date = "2024-01-01"

# 绑定 KV（已填入你的真实 KV ID）
[[kv_namespaces]]
binding = "OIL_KV"
id = "af76a1d05d444244a468ed02d6617f98"

# Cron 触发：每小时整点跑一次，具体抓什么由代码判断
#   · 每小时 :05  → 黄金（B7 起换 xaus.com 无 key 源，无配额限制，每小时抓）
#   · 北京 08:00 → 国内油价（万维易源 7-8 点更新后拉取）
#   · 其余整点   → 仅原油，须先通过闸门
#
#     （已移除：原 09:00 的万维易源 1108-2 历史日报 —— 见文末说明）
#
# ★ v8 起 cron 改为 5,20：每小时跑两次，靠相位区分用途
#     :05 → 盘中采样（开盘那小时 = 开盘后 5 分钟）
#     :20 → 收盘补抓（休市那小时 = 休市后 20 分钟）
#
# ⚠️ 为什么要 :20 而不是整点：
#     WTI 每天只休市 1 小时（芝加哥 16:00-17:00）。
#     若沿用旧逻辑「休市后 1 小时再抓」会落在 17:00 —— 那已经是【重新开盘】，
#     抓到的是新交易日开盘价，而不是当日收盘价。
#     布伦特休市 2 小时（伦敦 23:00-01:00），同样改为休市后 20 分钟抓，更稳。
#
# ⚠️ 闸门 · 布伦特（伦敦本地时间，BST/GMT 自动跟随）
#    · 周日 23:00 开盘（ICE 官方：Open 01:00, 23.00 on Sundays）
#    · 周一~周五 23:00 收盘，每日休市 23:00-01:00
#    · 周六全天休市
#    ※ 周一 00:00 属交易时段（周日 23:00 开盘的延续），旧代码会误判为休市
#
# ⚠️ 闸门 · WTI（芝加哥本地时间，CDT/CST 自动跟随）
#    · 周日 17:00 开盘
#    · 周一~周五 16:00 收盘，每日休市 16:00-17:00（仅 1 小时）
#    · 周六全天休市
#
# 两个品种任一在窗口内即调 API（一次请求同时带回两个价，不多花额度）
# 实测消耗：约 130 次/周，日均 18.6 次，离 50 次/天上限很宽裕
#
# 冬令时：英国 10 月底 BST→GMT 自动跟随，无需改代码
# 实测消耗：平均约 23 次/天，离 50 次/天上限很宽裕
[triggers]
crons = [
  "5,20 * * * *",     # 原油 / 国内油价 —— 与 B7 完全一致，一行不改
  "*/3 * * * *"       # ★ B8：黄金专用，每 3 分钟一次
]
# -------------------------------------------------------------------
# ⚠️ B8 为什么用【两条 cron】，而不是一条每分钟
#
#   最初设想是单条 "* * * * *"（每分钟唤醒），再在代码里用
#       const isOilPhase = (min === 5 || min === 20)
#   把原油挡回去。核对后放弃了这个做法，原因有二：
#
#   ① 分钟相等判断非常脆。
#      Cloudflare cron 偶有数秒漂移，一旦落在 4:59:5x 或 5:01，
#      min 就不是 5，原油那一小时会【整点静默漏抓】。
#      B7 原本不做分钟判断，只靠 cron 自己选时刻，反而更稳。
#
#   ② 每分钟抓黄金会撞上 KV 写入配额（★ 真正的硬伤）。
#      Workers KV 免费版：写入 1,000 次/天（官方文档明确）。
#      黄金每成功抓一次就写一次 gold_data：
#          每分钟 → 1,440 次/天 ＞ 1,000  → 超出后写入直接报错，
#          大约每天下午就把配额耗光，之后 gold_data 全天不再更新，
#          首屏数字会静默冻住 —— 这是必须避开的故障。
#
#   所以改成两条 cron 分开跑，各管各的：
#      "5,20 * * * *" → 原油/国内油价，行为与 B7 逐行一致
#      "*/3 * * * *"  → 黄金，480 次/天
#   合计约 480 + 原油约 25 + 历史/国内油价约 25 ≈ 530 次/天，
#   离 1,000 上限留有一倍余量。
#
#   黄金为什么是 3 分钟而不是 1 分钟：
#      3 号这一层本来就是【兜底 + 首屏】，真正的实时跳动由
#      2 号前端在浏览器里直连 biquote 完成（秒级）。
#      兜底数据旧 3 分钟对用户体验没有可感知差别，
#      但能把 KV 写入量降到配额的三分之一以下。
#   想改成 2 分钟：把 "*/3" 改成 "*/2"（720 次/天，仍在配额内）；
#   不建议再快，余量会太薄。
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# ⚠️ 以下密钥请勿写进本文件（会随仓库泄露）。
#    请在 Cloudflare Dashboard → Workers → oil-data-worker
#    → Settings → Variables and Secrets → Add 逐个添加（类型选 Secret）：
#
#      OILPRICEAPI_KEY     布伦特原油 API Token
#      （B7 起黄金不再需要 API Key：主源 xaus.com，备用 api.gold-api.com，均免 key）
#      SHOWAPI_APPKEY      万维易源 138-46 AppKey
#
#    本地开发用 .dev.vars（记得加进 .gitignore）：
#      OILPRICEAPI_KEY="xxxx"
#      SHOWAPI_APPKEY="xxxx"
# -------------------------------------------------------------------
# 配额提醒：
#   · OilPriceAPI：新账号 7 天试用 10,000 次，之后自动降为 50 次/天
#   · MetalpriceAPI 免费档：约 100 次/月 → 代码已加「每日闸门」，
#     定时任务每天 1 次；手动刷新当天已抓过则跳过，每天最多补抓 1 次
#   · 万维易源 138-46（国内油价）：免费档约 100 次/天 → v5 起同样加「每日闸门」
#   · 历史走势：自建累积，复用原油抓取，零额外额度
# -------------------------------------------------------------------
# ℹ️ 已移除：万维易源 1108-2（历史日报）
#     实测该接口免费档返回的日期与请求区间对不上（请求 2026-08~10，
#     返回 2025-12 的数据），价格与实时价差近一倍（62 vs 107），不可用。
#     历史走势改为自建：每次抓原油时顺便记一条日线（开/高/低/收）。
# -------------------------------------------------------------------

# -------------------------------------------------------------------

# 请求日志（CF 控制台 → Workers → 该站 → Observability 实时查看）
# 用于查清流量来源：Googlebot / 各类爬虫 / 扫描机器人
#
# ⚠️ invocation_logs = true 是关键：
#    只写 enabled = true 只会记录 console.log 的输出，
#    而本站代码里没有任何 console.log —— 那样等于什么都看不到。
#    invocation_logs 才负责记录「每一次请求」本身（URL / UA / IP / 状态码）。
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true      # ★ 记录每次调用，缺了它看不到访问者
head_sampling_rate = 1      # 100% 采样，不漏

# ===================================================================
# 私有后端访问密钥（v7 新增）
#
# 本站是 2 号 PriceScope 的专属数据后端，不对公网开放：
#   无密钥  /           → 403 占位页（不含任何数据）
#   无密钥  /data       → 403 JSON
#   无密钥  /update     → 404（不暴露路径存在，防止被刷爆 API 配额）
#   无密钥  /history    → 403 占位页
#   公开    /robots.txt → 返回 Disallow: /
#
# 2 号站通过请求头 X-Access-Key 携带同一密钥。
# ⚠️ 3 号与 2 号必须同密钥、两个包一起部署，否则 2 号取不到数据。
# ⚠️ 你自己浏览器访问：URL 后加 ?key=<下面的值>
# ===================================================================
[vars]
ACCESS_KEY = "lfwczh8pa4atakrpj7uwhybo2vexc76u"

# ---- 修复 Workers Builds 预览构建红叉 ----
# 根因：CF 对同一次提交跑两套构建，生产 wrangler deploy 成功，
#       预览 wrangler preview 要求配置中存在 [previews] 块。
# 本站有 1 个 vars，故需写全对应变量（留空占位）。
[previews.vars]
ACCESS_KEY = ""
