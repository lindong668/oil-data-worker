# wrangler.toml  —  oil-data-worker  v6
name = 'oil-data-worker'
main = "src/index.js"
compatibility_date = "2024-01-01"

# 绑定 KV（已填入你的真实 KV ID）
[[kv_namespaces]]
binding = "OIL_KV"
id = "af76a1d05d444244a468ed02d6617f98"

# Cron 触发：每小时整点跑一次，具体抓什么由代码判断
#   · 北京 04:00 → 黄金（每天仅此一次，保护月度配额）
#   · 北京 08:00 → 国内油价（万维易源 7-8 点更新后拉取）
#   · 其余整点   → 仅原油，须先通过闸门
#
#     （已移除：原 09:00 的万维易源 1108-2 历史日报 —— 该接口返回的日期与区间
#       对不上、价格与实时价差近一倍，数据不可信。现改为自建累积：
#       每次抓原油时顺便记一条日线，零额外额度。）
#   · 其余整点   → 仅原油，须先通过闸门
#
# ⚠️ 闸门 1 · 交易时段（isBrentTrading）：以伦敦本地时间判断，休市跳过不调 API
#    · 周六全天休市          → 跳过（最大浪费源，约 26 小时）
#    · 周五 23:00 伦敦收盘   → 跳过
#    · 周日 01:00 伦敦开盘前 → 跳过
#    · 每天 23:00-01:00 伦敦 → 每日结算休市，跳过
#
# ⚠️ 闸门 2 · 收盘补抓（isClosingWindow）：伦敦 00:00 = 休市后 1 小时
#    目的：把「当日最终价」钉死。若最后一次抓在休市前（如 22:00），
#          之后又不再抓，当天价格就会定错在半路上。
#    · 周二~周五 00:00 → 前一交易日的当日收盘价
#    · 周六     00:00 → 周五周收盘价 ★ 整个周末都显示它，最关键
#    · 周日     00:00 → 跳过（01:00 才开盘，抓到的是沿用值）
#    配合伦敦 01:00 开盘那次（交易时段），休市后 1~2 小时必定有抓取。
#
# 冬令时：英国 10 月底 BST→GMT 自动跟随，无需改代码
# 实测消耗：平均约 23 次/天，离 50 次/天上限很宽裕
[triggers]
crons = [
  "0 * * * *"     # 每小时整点（UTC）
]

# -------------------------------------------------------------------
# ⚠️ 以下密钥请勿写进本文件（会随仓库泄露）。
#    请在 Cloudflare Dashboard → Workers → oil-data-worker
#    → Settings → Variables and Secrets → Add 逐个添加（类型选 Secret）：
#
#      OILPRICEAPI_KEY     布伦特原油 API Token
#      METALPRICEAPI_KEY   黄金 API Key
#      SHOWAPI_APPKEY      万维易源 138-46 AppKey
#
#    本地开发用 .dev.vars（记得加进 .gitignore）：
#      OILPRICEAPI_KEY="xxxx"
#      METALPRICEAPI_KEY="xxxx"
#      SHOWAPI_APPKEY="xxxx"
# -------------------------------------------------------------------
# 配额提醒：
#   · OilPriceAPI：新账号 7 天试用 10,000 次，之后自动降为 50 次/天
#   · MetalpriceAPI 免费档：约 100 次/月 → 代码已加「每日闸门」，
#     定时任务每天 1 次；手动刷新当天已抓过则跳过，每天最多补抓 1 次
#   · 万维易源 138-46（国内油价）：免费档约 100 次/天 → v5 起同样加「每日闸门」
#   · 历史走势：自建累积，复用原油抓取，零额外额度
# -------------------------------------------------------------------
# ℹ️ 已移除：万维易源 1108-2（历史日报）
#     实测该接口免费档返回的日期与请求区间对不上（请求 2026-08~10，
#     返回 2025-12 的数据），价格与实时价差近一倍（62 vs 107），不可用。
#     历史走势改为自建：每次抓原油时顺便记一条日线（开/高/低/收）。
# -------------------------------------------------------------------

# -------------------------------------------------------------------

# 请求日志（CF 控制台 → Workers → 该站 → Observability 实时查看）
# 用于查清流量来源：Googlebot / 各类爬虫 / 扫描机器人
#
# ⚠️ invocation_logs = true 是关键：
#    只写 enabled = true 只会记录 console.log 的输出，
#    而本站代码里没有任何 console.log —— 那样等于什么都看不到。
#    invocation_logs 才负责记录「每一次请求」本身（URL / UA / IP / 状态码）。
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true      # ★ 记录每次调用，缺了它看不到访问者
head_sampling_rate = 1      # 100% 采样，不漏

# ===================================================================
# 私有后端访问密钥（v7 新增）
#
# 本站是 2 号 PriceScope 的专属数据后端，不对公网开放：
#   无密钥  /           → 403 占位页（不含任何数据）
#   无密钥  /data       → 403 JSON
#   无密钥  /update     → 404（不暴露路径存在，防止被刷爆 API 配额）
#   无密钥  /history    → 403 占位页
#   公开    /robots.txt → 返回 Disallow: /
#
# 2 号站通过请求头 X-Access-Key 携带同一密钥。
# ⚠️ 3 号与 2 号必须同密钥、两个包一起部署，否则 2 号取不到数据。
# ⚠️ 你自己浏览器访问：URL 后加 ?key=<下面的值>
# ===================================================================
[vars]
